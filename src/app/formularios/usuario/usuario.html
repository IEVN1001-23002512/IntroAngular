<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-6">
                <div class="card mt-5">

                    <div class="card-header text-center">
                        <h3>INICIO DE SESIÓN</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-group">
                                <label for="usuario">Usuario:</label>
                                <input [(ngModel)]="usuario" name="usuario" type="text"
                                    class="form-control" id="usuario" placeholder="Ingrese su usuario">
                            </div>
                            <div class="form-group pt-3">
                                <label for="contrasena">Contraseña:</label>
                                <input [(ngModel)]="contrasena" name="contrasena" type="password"
                                    class="form-control" id="contrasena" placeholder="Ingrese su contraseña">
                            </div>

                            <div class="text-center pt-4">
                                <button (click)="validar()" type="button" class="btn btn-primary">
                                    Iniciar sesión
                                </button>
                            </div>

                        </form>
                        <div class="text-center pt-4">
                            <h5>{{mensaje}}</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
